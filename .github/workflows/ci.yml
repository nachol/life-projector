name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Server boots
        run: |
          MDNS=false HTTPS_PORT=0 DATA_DIR=$RUNNER_TEMP/data node server/index.js &
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/scenes > /dev/null
          curl -fs localhost:8080/display > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: life-projector:ci
