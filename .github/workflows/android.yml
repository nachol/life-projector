name: Android TV app

on:
  push:
    # Declaring only `tags` would silently skip branch pushes, so list both.
    branches: ["**"]
    tags: ["v*"]
    paths: ["android-tv/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-tv/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The ubuntu-latest image already ships the Android SDK (ANDROID_HOME); the Android
      # Gradle plugin downloads the exact platform / build-tools it needs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk life-projector-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: life-projector-tv-apk
          path: android-tv/life-projector-tv.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-tv/life-projector-tv.apk
